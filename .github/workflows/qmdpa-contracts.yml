name: QM/DPA PySCF patch contracts

on:
  push:
    branches: ['qmdpa/**']
    paths: ['pyscf/**', '.github/workflows/qmdpa-contracts.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install isolated CI base
        working-directory: ${{ runner.temp }}
        run: python -m pip install pyscf==2.14.0 pytest
      - name: Overlay the three reviewed Python patches
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, shutil
          import pyscf
          source = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "pyscf"
          target = pathlib.Path(pyscf.__file__).parent
          for name in ("lib/diis.py", "nac/sacasscf.py", "grad/tdrhf.py"):
              shutil.copy2(source / name, target / name)
              assert (source / name).read_bytes() == (target / name).read_bytes()
              print(name, hashlib.sha256((target / name).read_bytes()).hexdigest())
          PY
      - name: Run DIIS and reversed-state NAC regressions
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest --import-mode=importlib -q \
            "$GITHUB_WORKSPACE/pyscf/lib/test/test_diis.py" \
            "$GITHUB_WORKSPACE/pyscf/nac/test/test_sacasscf.py" \
            -k 'dependent_error_vectors or nonfinite_error_vectors_rejected or reversed_state_response'
